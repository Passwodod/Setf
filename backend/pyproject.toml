[project]
name = "social-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pgvector>=0.3",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "httpx>=0.27",
  "email-validator>=2.1",
  "telethon>=1.45.0",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "psycopg2-binary>=2.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
