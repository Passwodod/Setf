name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: sia, POSTGRES_PASSWORD: sia_dev_pw, POSTGRES_DB: sia_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sia" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
